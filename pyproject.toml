[project]
name = "eaf-operation-ml"
version = "0.1.0"
description = "Estimate electrical energy use for an electric arc furnace heat"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "jupyter>=1.1.1",
    "lightgbm>=4.7.0",
    "matplotlib>=3.10.8",
    "numpy>=2.5.4",
    "pandas>=3.0.1",
    "plotly>=6.6.0",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "shap>=0.54.1",
    "tqdm>=4.67.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "mlflow>=3.16.1",
]
